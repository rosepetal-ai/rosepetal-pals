[package]
name = "pals"
description = "PALS daemon: an A2A v1.0 agent server whose peers reach it over Iroh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
a2a.workspace = true
a2a-server.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
iroh.workspace = true
iroh-blobs.workspace = true
iroh-tickets.workspace = true
pals-core.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util.workspace = true
toml.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The stock A2A client, to talk to peers through the gateway as any client would.
a2a-client.workspace = true
assert_cmd.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
