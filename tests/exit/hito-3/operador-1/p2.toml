# p2: a provider of operator 1 on network A; announces its public
# capabilities (p2-inventario.toml, which also has a private service and a
# project one, never announced), entering through r1.
[agent]
name = "p2"
description = "Proveedor p2 del operador 1 en la prueba de salida del hito 3"

[gateway]
listen = "127.0.0.1:7420"

[worker]
adapter = "echo"

[net]
relay = false
listen = "0.0.0.0:4433"

[dht]
enabled = true
mode = "client"
bootstrap = ["@TICKET_R1@"]
announce = true
record_ttl_s = 120
republish_s = 40
